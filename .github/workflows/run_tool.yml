name: Run TikTok Gemini Tool

on:
  schedule:
    # Chạy mỗi 6 tiếng một lần (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Cho phép chạy thủ công từ tab Actions trên GitHub

jobs:
  run-tool:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        env:
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
          WEB_API_KEY: ${{ secrets.WEB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
